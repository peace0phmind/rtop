[package]
name = "rtop"
version = "0.1.0"
edition = "2021"
description = "A native Rust virtual knowledge graph runtime"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "rtop"
path = "src/lib.rs"

[[bin]]
name = "rtop"
path = "src/main.rs"

[dependencies]
bigdecimal = "0.4"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
chrono = "0.4"
chrono-tz = "0.10"
fallible-iterator = "0.2"
oxiri = "0.2"
rio_api = "0.8"
rio_turtle = "0.8"
rio_xml = "0.8"
regex = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.52"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
